# ============================================================
# config.yaml - Cấu hình toàn bộ hệ thống
# Tất cả tham số được quản lý tại đây, không hard-code trong code
# ============================================================

# --- Đường dẫn project ---
paths:
  models_dir: "models"
  yolo_model: "models/yolo/yolov8n.pt"
  par_model: "models/par/par_resnet50.pth"
  data_dir: "data"
  results_dir: "results"
  crops_dir: "results/crops"
  logs_dir: "results/logs"
  database: "results/person_retrieval.db"

# --- Module Detection (YOLO) ---
detection:
  model: "yolov8n.pt"          # Model nhỏ nhất, đủ nhanh cho demo
  confidence: 0.45             # Ngưỡng confidence tối thiểu (cân bằng tối ưu)
  iou: 0.5                     # IoU threshold cho NMS
  classes: [0]                 # Class 0 = person trong COCO
  imgsz: 640                   # Kích thước ảnh input YOLO
  device: "cuda"               # "cuda" khi có GPU GTX 1650, "cpu" nếu không có GPU

# --- Module Tracking (ByteTrack / BoT-SORT) ---
tracking:
  tracker: "bytetrack.yaml"    # Hỗ trợ "bytetrack.yaml" (mặc định) hoặc "botsort.yaml" (BoT-SORT khi camera rung lắc)
  persist: true                # Giữ track ID qua các frame

# --- Module Attribute Recognition ---
attributes:
  input_size: [224, 112]       # Kích thước crop đưa vào PAR model (tỷ lệ người đứng, Resize 256x128 -> CenterCrop 224x112)
  # Ngưỡng F1 tối ưu trên tập PA-100K
  threshold:
    gender: 0.50
    hat: 0.62                  # Nâng cao tránh nhầm tóc đen/búi tóc
    glasses: 0.50
    backpack: 0.50

# --- Evaluation ---
evaluation:
  dataset: "PA-100K"
  val_mA: 0.8933               # Mean Accuracy chuẩn PAR (balanced: 0.5*(TP/P + TN/N)) từ Colab T4 training
  per_class:
    gender_female: 0.852       # Accuracy giới tính
    hat: 0.847                 # Accuracy nhận dạng mũ
    glasses: 0.910             # Accuracy nhận dạng kính
    backpack: 0.967            # Accuracy nhận dạng balo
  eval_script: "scripts/evaluate_par.py"

# --- Module Color Detection ---
color:
  method: "kmeans_hsv"          # Hỗ trợ: "kmeans_hsv", "hsv_delta_e", "learned_head" (Deep Learning Color Head - GĐ 2)
  # Phần trăm crop dùng để detect màu upper (50% trên = phần áo)
  upper_ratio: 0.5
  # Phần trăm crop dùng để detect màu lower (40% dưới = phần quần)
  lower_ratio: 0.4
  # Số cluster K-Means để tìm màu chủ đạo
  n_clusters: 3
  # Tên các màu hỗ trợ
  upper_colors: ["Black", "White", "Red", "Blue", "Green", "Yellow", "Purple", "Gray", "Other"]
  lower_colors: ["Black", "White", "Blue", "Gray", "Other"]

# --- Module Matching ---
matching:
  default_threshold: 0.70      # Ngưỡng điểm matching mặc định (70% attributes phải khớp)

# --- Pipeline Processing ---
pipeline:
  max_cnn_per_frame: 2          # Giới hạn số forward pass PAR mỗi frame
  ema_alpha: 0.35               # Hệ số EMA mặc định cho smoothing xác suất thuộc tính
  eviction_interval: 50         # Dọn dẹp track_memory mỗi N frames
  ghost_window_frames: 150      # Cửa sổ thời gian ghost track (frames) - 5 giây
  ghost_max_size: 50            # Số ghost tracks tối đa giữ lại
  track_ttl_frames: 300         # Track không cập nhật sau N frames sẽ bị evict
  track_max_size: 500           # Số track tối đa trong bộ nhớ

# --- Re-ID Configuration ---
reid:
  enabled: true
  cosine_threshold: 0.50        # Ngưỡng cosine similarity cho ghost matching
  total_score_threshold: 0.55   # Ngưỡng tổng điểm kết hợp
  ema_alpha: 0.70               # Hệ số EMA cho cập nhật embedding
  reid_weight: 0.70             # Trọng số Re-ID trong tổng điểm
  attr_weight: 0.30             # Trọng số thuộc tính trong tổng điểm
  ghost_window_frames: 150      # Cửa sổ thời gian ghost matching

# --- Video Processing ---
video:
  # Nếu True: xử lý từng frame (chậm, chính xác hơn)
  # Nếu False: skip frame (nhanh hơn, đủ cho demo)
  process_every_n_frames: 2    # Xử lý 1 frame, bỏ qua 1 frame
  display_width: 1280          # Độ rộng hiển thị video trong GUI
  save_output: true            # Lưu video output có annotation

# --- Streamlit GUI ---
app:
  title: "Person Retrieval System"
  page_icon: "🔍"
  layout: "wide"
